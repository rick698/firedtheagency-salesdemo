name: Deploy clients portal

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy to firedtheagency.com/clients
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./
          server-dir: ${{ secrets.FTP_CLIENTS_DIR }}
          exclude: |
            **/.git*
            **/.git*/**
            .github/**
            database/**
            firedtheagency-setup-export/**
            firedtheagency-setup-export.zip
            *.md
            app/config/local.php
            app/vendor/stripe-php-19.3.0/README.md
            app/vendor/stripe-php-19.3.0/CHANGELOG.md
            app/vendor/stripe-php-19.3.0/CONTRIBUTING.md
            app/vendor/stripe-php-19.3.0/composer.json
